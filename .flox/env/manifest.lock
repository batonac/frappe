{
  "lockfile-version": 1,
  "manifest": {
    "version": 1,
    "install": {
      "caddy": {
        "pkg-path": "caddy"
      },
      "cups": {
        "pkg-path": "cups"
      },
      "curl": {
        "pkg-path": "curl"
      },
      "gcc": {
        "pkg-path": "gcc"
      },
      "git": {
        "pkg-path": "git"
      },
      "gnused": {
        "pkg-path": "gnused"
      },
      "libffi": {
        "pkg-path": "libffi"
      },
      "libmysqlclient": {
        "pkg-path": "mariadb-connector-c"
      },
      "nginx": {
        "pkg-path": "nginx"
      },
      "nodejs": {
        "pkg-path": "nodejs_20"
      },
      "openssl": {
        "pkg-path": "openssl"
      },
      "pip": {
        "pkg-path": "python311Packages.pip"
      },
      "pkg-config": {
        "pkg-path": "pkg-config"
      },
      "poppler_utils": {
        "pkg-path": "poppler_utils"
      },
      "python3": {
        "pkg-path": "python3",
        "version": "3.11"
      },
      "redis": {
        "pkg-path": "redis"
      },
      "sqlite": {
        "pkg-path": "sqlite"
      },
      "uv": {
        "pkg-path": "uv"
      },
      "zlib": {
        "pkg-path": "zlib"
      }
    },
    "vars": {
      "BENCH_USE_UV": "1",
      "DEV_SERVER": "1",
      "FRAPPE_BENCH_ROOT": "$FLOX_ENV_CACHE",
      "FRAPPE_DB_NAME": "frappe",
      "FRAPPE_DB_TYPE": "sqlite",
      "FRAPPE_ENV_TYPE": "development",
      "FRAPPE_REDIS_CACHE": "redis://127.0.0.1:13000",
      "FRAPPE_REDIS_QUEUE": "redis://127.0.0.1:11000",
      "FRAPPE_REDIS_SOCKETIO": "redis://127.0.0.1:12000",
      "FRAPPE_SOCKETIO_PORT": "9000",
      "FRAPPE_STREAM_LOGGING": "1",
      "FRAPPE_TUNE_GC": "1",
      "LIVE_RELOAD": "1",
      "MSHEADER": "$FLOX_ENV/include/mysql/mysql.h",
      "SITES_PATH": "$FLOX_ENV_CACHE/sites"
    },
    "hook": {
      "on-activate": "  # Create bench directory structure in FLOX_ENV_CACHE (the bench root)\n  mkdir -p \"$FLOX_ENV_CACHE\"/{apps,sites/assets,config,logs,config/pids}\n  \n  # Symlink frappe source ($PWD) into FLOX_ENV_CACHE/apps/frappe\n  mkdir -p \"$FLOX_ENV_CACHE/apps\"\n  if [ ! -e \"$FLOX_ENV_CACHE/apps/frappe\" ]; then\n    ln -sf \"$PWD\" \"$FLOX_ENV_CACHE/apps/frappe\"\n  fi\n\n  # Provision apps.txt in the sites directory\n  # This allows bench to recognize the frappe app\n  if [ ! -e \"$FLOX_ENV_CACHE/sites/apps.txt\" ]; then\n    echo \"frappe\" > \"$FLOX_ENV_CACHE/sites/apps.txt\"\n  fi\n  \n  # Setup Python virtual environment\n  export PYTHON_DIR=\"$FLOX_ENV_CACHE/env\"\n  if [ ! -d \"$PYTHON_DIR\" ]; then\n    echo \"Creating python virtual environment in $PYTHON_DIR\"\n    python -m venv \"$PYTHON_DIR\"\n  fi\n  \n  # Create convenience symlinks in $PWD for bench directories\n  # These allow running bench commands from the frappe development root\n  for dir in apps env sites config logs; do\n    if [ ! -e \"$PWD/$dir\" ] || [ ! -L \"$PWD/$dir\" ]; then\n      ln -sf \"$FLOX_ENV_CACHE/$dir\" \"$PWD/$dir\"\n    fi\n  done\n\n  # Install frappe and dependencies in a subshell\n  (\n    source \"$PYTHON_DIR/bin/activate\"\n    # Install/upgrade pip, setuptools, wheel using uv\n    uv pip install --quiet --upgrade pip setuptools wheel --python \"$PYTHON_DIR/bin/python\"\n    \n    # Install frappe in editable mode from $PWD using uv\n    uv pip install -e \"$PWD\" --quiet --python \"$PYTHON_DIR/bin/python\"\n    \n    # Install bench CLI using uv\n    uv pip install frappe-bench --quiet --python \"$PYTHON_DIR/bin/python\" 2>/dev/null || true\n  )\n  \n  # Create site-specific directories if sites exist\n  for site in \"$FLOX_ENV_CACHE/sites\"/*/ ; do\n    if [ -d \"$site\" ] && [ \"$(basename \"$site\")\" != \"assets\" ]; then\n      mkdir -p \"$site/db\"\n      mkdir -p \"$site/error-snapshots\"\n      mkdir -p \"$site/indexes\"\n      mkdir -p \"$site/locks\"\n      mkdir -p \"$site/logs\"\n      mkdir -p \"$site/private/files\"\n      mkdir -p \"$site/public/files\"\n    fi\n  done\n\n  echo \"✅ Frappe bench environment ready!\"\n  echo \"   Bench root: $FLOX_ENV_CACHE\"\n  echo \"   Frappe source: $PWD\"\n  echo \"   Working directory: $PWD (bench commands work here!)\"\n  echo \"   Using uv for Python package management\"\n  echo \"\"\n  echo \"💡 Site data is ephemeral and won't be committed to git\"\n  echo \"💡 Run 'flox services start' to start all services\"\n"
    },
    "profile": {
      "bash": "  # Activate Python virtual environment\n  source \"$PYTHON_DIR/bin/activate\"\n  \n  # Helpful aliases\n  alias frappe-shell='python -c \"import frappe; frappe.init(site=\"<site-name>\"); frappe.connect()\"'\n  alias bench-new-site='bench new-site --db-type sqlite --admin-password admin'\n  \n  echo \"\"\n  echo \"╔════════════════════════════════════════════════════════════╗\"\n  echo \"║            Frappe Development Environment                  ║\"\n  echo \"║                  (SQLite Edition)                          ║\"\n  echo \"╠════════════════════════════════════════════════════════════╣\"\n  echo \"║  Start all services:                                       ║\"\n  echo \"║    flox services start                                     ║\"\n  echo \"║                                                            ║\"\n  echo \"║  Create a new site:                                        ║\"\n  echo \"║    bench new-site frappe_dev.localhost --db-type sqlite            ║\"\n  echo \"║                                                            ║\"\n  echo \"║  Common commands (run from $PWD):                          ║\"\n  echo \"║    bench --site <site> migrate                             ║\"\n  echo \"║    bench --site <site> console                             ║\"\n  echo \"║    bench --site <site> clear-cache                         ║\"\n  echo \"╚════════════════════════════════════════════════════════════╝\"\n  echo \"\"\n  echo \"Note: Using SQLite for local development.\"\n  echo \"      For production, use MariaDB or PostgreSQL.\"\n  echo \"\"\n",
      "zsh": "  # Activate Python virtual environment\n  source \"$PYTHON_DIR/bin/activate\"\n  \n  # Helpful aliases\n  alias frappe-shell='python -c \"import frappe; frappe.init(site=\"<site-name>\"); frappe.connect()\"'\n  alias bench-new-site='bench new-site --db-type sqlite --admin-password admin'\n  \n  echo \"\"\n  echo \"╔════════════════════════════════════════════════════════════╗\"\n  echo \"║            Frappe Development Environment                  ║\"\n  echo \"║                  (SQLite Edition)                          ║\"\n  echo \"╠════════════════════════════════════════════════════════════╣\"\n  echo \"║  Start all services:                                       ║\"\n  echo \"║    flox services start                                     ║\"\n  echo \"║                                                            ║\"\n  echo \"║  Create a new site:                                        ║\"\n  echo \"║    bench new-site frappe_dev.localhost --db-type sqlite            ║\"\n  echo \"║                                                            ║\"\n  echo \"║  Common commands (run from $PWD):                          ║\"\n  echo \"║    bench --site <site> migrate                             ║\"\n  echo \"║    bench --site <site> console                             ║\"\n  echo \"║    bench --site <site> clear-cache                         ║\"\n  echo \"╚════════════════════════════════════════════════════════════╝\"\n  echo \"\"\n  echo \"Note: Using SQLite for local development.\"\n  echo \"      For production, use MariaDB or PostgreSQL.\"\n  echo \"\"\n",
      "fish": "  # Activate Python virtual environment\n  source \"$PYTHON_DIR/bin/activate.fish\"\n  \n  # Helpful aliases\n  alias frappe-shell 'python -c \"import frappe; frappe.init(site=\"<site-name>\"); frappe.connect()\"'\n  alias bench-new-site 'bench new-site --db-type sqlite --admin-password admin'\n",
      "tcsh": "  # Activate Python virtual environment\n  source \"$PYTHON_DIR/bin/activate.csh\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-darwin",
        "x86_64-linux"
      ]
    },
    "services": {
      "caddy": {
        "command": "caddy run --config $FLOX_ENV_PROJECT/.flox/env/Caddyfile",
        "is-daemon": true
      },
      "redis-cache": {
        "command": "  redis-server --port 13000 --bind 127.0.0.1 --dir $FLOX_ENV_CACHE/sites --dbfilename cache.rdb --save \"\" --appendonly no --maxmemory 500mb --maxmemory-policy allkeys-lru\n",
        "is-daemon": true
      },
      "redis-queue": {
        "command": "  redis-server --port 11000 --bind 127.0.0.1 --dir $FLOX_ENV_CACHE/sites --dbfilename queue.rdb --save 900 1 --save 300 10 --save 60 10000 --appendonly yes\n",
        "is-daemon": true
      },
      "redis-socketio": {
        "command": "  redis-server --port 12000 --bind 127.0.0.1 --dir $FLOX_ENV_CACHE/sites --dbfilename socketio.rdb --save \"\" --appendonly no\n",
        "is-daemon": true
      },
      "scheduler": {
        "command": "bench schedule",
        "is-daemon": true
      },
      "socketio": {
        "command": "  rm -f $FLOX_ENV_CACHE/sites/socketio.sock && node $FLOX_ENV_PROJECT/socketio.js\n",
        "is-daemon": true
      },
      "web": {
        "command": "  cd $FLOX_ENV_CACHE/sites && gunicorn -b 127.0.0.1:8000 -w 4 --max-requests 5000 --max-requests-jitter 500 -t 120 --graceful-timeout 30 --preload frappe.app:application\n",
        "is-daemon": true
      },
      "worker-long": {
        "command": "bench worker --queue long,default,short",
        "is-daemon": true
      },
      "worker-short": {
        "command": "bench worker --queue short,default",
        "is-daemon": true
      }
    },
    "build": {
      "myproject": {
        "command": "# Install dependencies\nyarn install\n\n# Build\nyarn build\n# -> assuming this yields a `dist` directory\n\n# Install the build result to `out` # (1)!\nmkdir -p $out\nmv ./dist $out/\n\n## If your app does not use a bundler\n## and needs additional node_modules at runtime,\n## `yarn prune` and copy the node modules to $out\n#\n# yarn prune --include \"prod\"\n# cp -r ./node_modules $out\n\n# Create a run script # (2)!\nmkdir -p $out/bin\necho \"#!/usr/bin/env sh\"\necho 'exec node $out/dist/index.js \"$@\"' >> $out/bin/myproject\nchmod 755 $out/bin/myproject\n"
      }
    }
  },
