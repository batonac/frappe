{
  "lockfile-version": 1,
  "manifest": {
    "version": 1,
    "install": {
      "caddy": {
        "pkg-path": "caddy"
      },
      "cups": {
        "pkg-path": "cups"
      },
      "curl": {
        "pkg-path": "curl"
      },
