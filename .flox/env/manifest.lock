        "pkg-path": "gcc"
      },
      "git": {
        "pkg-path": "git"
      },
      "gnused": {
        "pkg-path": "gnused"
      },
      "gunicorn": {
        "pkg-path": "python314Packages.gunicorn"
      },
      "just": {
        "pkg-path": "just"
      },
      "libffi": {
        "pkg-path": "libffi"
      },
      "libmysqlclient": {
        "pkg-path": "mariadb-connector-c"
      },
      "mysqlclient": {
        "pkg-path": "python314Packages.mysqlclient"
      },
      "nginx": {
        "pkg-path": "nginx"
      },
      "nodejs": {
        "pkg-path": "nodejs_24"
      },
      "openssl": {
        "pkg-path": "openssl"
      },
      "pip": {
        "pkg-path": "python314Packages.pip"
      },
      "pkg-config": {
        "pkg-path": "pkg-config"
      },
      "poppler-utils": {
        "pkg-path": "poppler-utils"
      },
      "python3": {
        "pkg-path": "python314"
      },
      "redis": {
        "pkg-path": "redis"
      },
      "sqlite": {
        "pkg-path": "sqlite"
      },
      "uv": {
        "pkg-path": "uv"
      },
      "zlib": {
        "pkg-path": "zlib"
      }
    },
    "vars": {
      "BENCH_SERVICE_MANAGER": "flox",
      "BENCH_SERVICE_MANAGER_COMMAND": "services start",
      "BENCH_USE_UV": "1",
      "DEV_SERVER": "1",
      "FRAPPE_BENCH_ROOT": "$FLOX_ENV_CACHE",
      "FRAPPE_DB_NAME": "frappe",
      "FRAPPE_DB_TYPE": "sqlite",
      "FRAPPE_ENV_TYPE": "development",
      "FRAPPE_REDIS_CACHE": "redis://127.0.0.1:13080",
      "FRAPPE_REDIS_QUEUE": "redis://127.0.0.1:11080",
      "FRAPPE_REDIS_SOCKETIO": "redis://127.0.0.1:12080",
      "FRAPPE_SOCKETIO_PORT": "8888",
      "FRAPPE_SOCKETIO_UDS": "$FRAPPE_SOCKETS_DIR/socketio.sock",
      "FRAPPE_SOCKETS_DIR": "$FLOX_ENV_CACHE/sockets",
      "FRAPPE_STREAM_LOGGING": "1",
      "FRAPPE_TUNE_GC": "1",
      "FRAPPE_WEBSERVER_PORT": "8888",
      "FRAPPE_WEB_SOCKET": "$FRAPPE_SOCKETS_DIR/frappe.sock",
      "LIVE_RELOAD": "1",
      "MSHEADER": "$FLOX_ENV/include/mysql/mysql.h",
      "NO_SERVICE_RESTART": "1",
      "NO_STATICS": "",
      "SITES_PATH": "$FLOX_ENV_CACHE/sites",
      "USE_PROFILER": "",
      "USE_PROXY": ""
    },
    "hook": {
      "on-activate": "  # Create bench directory structure in FLOX_ENV_CACHE (the bench root)\n  mkdir -p \"$FLOX_ENV_CACHE\"/{apps,sites/assets,config,logs,config/pids,sockets}\n  \n  # Symlink frappe source ($FLOX_ENV_PROJECT) into FLOX_ENV_CACHE/apps/frappe\n  mkdir -p \"$FLOX_ENV_CACHE/apps\"\n  if [ ! -e \"$FLOX_ENV_CACHE/apps/frappe\" ]; then\n    ln -sf \"$FLOX_ENV_PROJECT\" \"$FLOX_ENV_CACHE/apps/frappe\"\n  fi\n\n  # Provision apps.txt in the sites directory\n  # This allows bench to recognize the frappe app\n  if [ ! -e \"$FLOX_ENV_CACHE/sites/apps.txt\" ]; then\n    echo \"frappe\" > \"$FLOX_ENV_CACHE/sites/apps.txt\"\n  fi\n  \n  # Setup Python virtual environment\n  # Export PYTHON_DIR so it's available to profile scripts and subprocesses\n  export PYTHON_DIR=\"$FLOX_ENV_CACHE/env\"\n  if [ ! -d \"$PYTHON_DIR\" ]; then\n    echo \"Creating python virtual environment in $PYTHON_DIR\" >&2\n    python -m venv \"$PYTHON_DIR\"\n  fi\n  \n  # Add venv bin to PATH directly (needed for direnv in-place activation)\n  export PATH=\"$PYTHON_DIR/bin:$PATH\"\n  export VIRTUAL_ENV=\"$PYTHON_DIR\"\n  \n  # Create convenience symlinks in $FLOX_ENV_PROJECT for bench directories\n  # These allow running bench commands from the frappe development root\n  for dir in apps env sites config logs; do\n    if [ ! -L \"$FLOX_ENV_PROJECT/$dir\" ]; then\n      ln -sfn \"$FLOX_ENV_CACHE/$dir\" \"$FLOX_ENV_PROJECT/$dir\"\n    fi\n  done\n\n  # Install frappe and dependencies in a subshell\n  (\n    # Install/upgrade pip, setuptools, wheel using uv\n    uv pip install --quiet --upgrade pip setuptools wheel --python \"$PYTHON_DIR/bin/python\"\n    \n    # Install frappe in editable mode from $FLOX_ENV_PROJECT using uv\n    uv pip install -e \"$FLOX_ENV_PROJECT\" --quiet --python \"$PYTHON_DIR/bin/python\"\n    \n    # Install bench CLI using uv\n    uv pip install frappe-bench --quiet --python \"$PYTHON_DIR/bin/python\" 2>/dev/null || true\n\n    # Pre-install common dependencies for Frappe apps\n    \"$PYTHON_DIR/bin/bench\" setup requirements\n\n    # build assets (JS/CSS) for Frappe\n    \"$PYTHON_DIR/bin/bench\" build\n  )\n  \n  # Create site-specific directories if sites exist\n  for site in \"$FLOX_ENV_CACHE/sites\"/*/ ; do\n    if [ -d \"$site\" ] && [ \"$(basename \"$site\")\" != \"assets\" ]; then\n      mkdir -p \"$site/db\"\n      mkdir -p \"$site/error-snapshots\"\n      mkdir -p \"$site/indexes\"\n      mkdir -p \"$site/locks\"\n      mkdir -p \"$site/logs\"\n      mkdir -p \"$site/private/files\"\n      mkdir -p \"$site/public/files\"\n    fi\n  done\n"
    },
    "profile": {
      "common": "  # Helpful aliases (POSIX-compatible)\n  alias frappe-shell='python -c \"import frappe; frappe.init(site=\\\"<site-name>\\\"); frappe.connect()\"'\n  alias bench-new-site='bench new-site --db-type sqlite --admin-password admin'\n\n  echo \"\" >&2\n  echo \"╔════════════════════════════════════════════════════════════╗\" >&2\n  echo \"║            Frappe Development Environment                  ║\" >&2\n  echo \"║                  (SQLite Edition)                          ║\" >&2\n  echo \"╠════════════════════════════════════════════════════════════╣\" >&2\n  echo \"║  Start all services:                                       ║\" >&2\n  echo \"║    flox services start                                     ║\" >&2\n  echo \"║                                                            ║\" >&2\n  echo \"║  Create a new site:                                        ║\" >&2\n  echo \"║    bench new-site frappe-dev.localhost --db-type sqlite    ║\" >&2\n  echo \"║                                                            ║\" >&2\n  echo \"║  Common commands:                                          ║\" >&2\n  echo \"║    bench --site <site> migrate                             ║\" >&2\n  echo \"║    bench --site <site> console                             ║\" >&2\n  echo \"║    bench --site <site> clear-cache                         ║\" >&2\n  echo \"╚════════════════════════════════════════════════════════════╝\" >&2\n  echo \"\" >&2\n  echo \"✅ Frappe bench environment ready!\" >&2\n  echo \"   Bench root: $FLOX_ENV_CACHE\" >&2\n  echo \"   Sockets: $FLOX_ENV_CACHE/sockets/\" >&2\n  echo \"   Using uv for Python package management\" >&2\n  echo \"\" >&2\n  echo \"Note: All services use Unix sockets (except Caddy on port $FRAPPE_WEBSERVER_PORT)\" >&2\n  echo \"      Using SQLite for local development.\" >&2\n  echo \"\" >&2\n  echo \"💡 Site data is ephemeral and won't be committed to git\" >&2\n  echo \"💡 Run 'flox services start' to start all services\" >&2\n",
      "bash": "  # Activate venv (for interactive shells)\n  source \"$PYTHON_DIR/bin/activate\"\n",
      "zsh": "  # Activate venv (for interactive shells)\n  source \"$PYTHON_DIR/bin/activate\"\n",
      "fish": "  # Activate venv (for interactive shells)\n  source \"$PYTHON_DIR/bin/activate.fish\"\n",
      "tcsh": "  # Activate venv (for interactive shells)\n  source \"$PYTHON_DIR/bin/activate.csh\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-darwin",
        "x86_64-linux"
      ]
    },
    "services": {
      "caddy": {
        "command": "caddy run --config $FLOX_ENV_PROJECT/.flox/env/Caddyfile",
        "is-daemon": false
      },
      "redis-cache": {
        "command": "  mkdir -p \"$FLOX_ENV_CACHE/sites\" && redis-server --port 13080 --bind 127.0.0.1 --dir \"$FLOX_ENV_CACHE/sites\" --dbfilename cache.rdb --save \"\" --appendonly no --maxmemory 500mb --maxmemory-policy allkeys-lru\n",
        "is-daemon": false
      },
      "redis-queue": {
        "command": "  mkdir -p \"$FLOX_ENV_CACHE/sites\" && redis-server --port 11080 --bind 127.0.0.1 --dir \"$FLOX_ENV_CACHE/sites\" --dbfilename queue.rdb --save 900 1 --save 300 10 --save 60 10000 --appendonly no\n",
        "is-daemon": false
      },
      "redis-socketio": {
        "command": "  mkdir -p \"$FLOX_ENV_CACHE/sites\" && redis-server --port 12080 --bind 127.0.0.1 --dir \"$FLOX_ENV_CACHE/sites\" --dbfilename socketio.rdb --save \"\" --appendonly no\n",
        "is-daemon": false
      },
      "scheduler": {
        "command": "  source \"$FLOX_ENV_CACHE/env/bin/activate\" && cd \"$FLOX_ENV_CACHE\" && bench schedule\n",
        "is-daemon": false
      },
      "socketio": {
        "command": "  source \"$FLOX_ENV_CACHE/env/bin/activate\" && mkdir -p \"$FLOX_ENV_CACHE/sockets\" && rm -f \"$FLOX_ENV_CACHE/sockets/socketio.sock\" && cd \"$FLOX_ENV_CACHE\" && node \"$FLOX_ENV_PROJECT/socketio.js\"\n",
        "is-daemon": false
      },
      "web": {
        "command": "  source \"$FLOX_ENV_CACHE/env/bin/activate\" && mkdir -p \"$FLOX_ENV_CACHE/sockets\" \"$FLOX_ENV_CACHE/logs\" && rm -f \"$FLOX_ENV_CACHE/sockets/frappe.sock\" && cd \"$FLOX_ENV_CACHE/sites\" && gunicorn --bind \"unix:$FLOX_ENV_CACHE/sockets/frappe.sock\" --workers 4 --max-requests 5000 --max-requests-jitter 500 --timeout 120 --graceful-timeout 30 --preload --error-logfile \"$FLOX_ENV_CACHE/logs/web.error.log\" --access-logfile \"$FLOX_ENV_CACHE/logs/web.log\" --capture-output frappe.app:application\n",
        "is-daemon": false
      },
      "worker-long": {
        "command": "  source \"$FLOX_ENV_CACHE/env/bin/activate\" && cd \"$FLOX_ENV_CACHE\" && bench worker --queue long,default,short\n",
        "is-daemon": false
      },
      "worker-short": {
        "command": "  source \"$FLOX_ENV_CACHE/env/bin/activate\" && cd \"$FLOX_ENV_CACHE\" && bench worker --queue short,default\n",
        "is-daemon": false
      }
    },
    "build": {
      "myproject": {
        "command": "# Install dependencies\nyarn install\n\n# Build\nyarn build\n# -> assuming this yields a `dist` directory\n\n# Install the build result to `out` # (1)!\nmkdir -p $out\nmv ./dist $out/\n\n## If your app does not use a bundler\n## and needs additional node_modules at runtime,\n## `yarn prune` and copy the node modules to $out\n#\n# yarn prune --include \"prod\"\n# cp -r ./node_modules $out\n\n# Create a run script # (2)!\nmkdir -p $out/bin\necho \"#!/usr/bin/env sh\"\necho 'exec node $out/dist/index.js \"$@\"' >> $out/bin/myproject\nchmod 755 $out/bin/myproject\n"
      }
    }
  },
