        "pkg-path": "gcc"
      },
      "git": {
        "pkg-path": "git"
      },
      "gnused": {
        "pkg-path": "gnused"
      },
      "libffi": {
        "pkg-path": "libffi"
      },
      "mariadb": {
        "pkg-path": "mariadb"
      },
      "nginx": {
        "pkg-path": "nginx"
      },
      "nodejs": {
        "pkg-path": "nodejs_20"
      },
      "openssl": {
        "pkg-path": "openssl"
      },
      "pkg-config": {
        "pkg-path": "pkg-config"
      },
      "poppler_utils": {
        "pkg-path": "poppler_utils"
      },
      "python3": {
        "pkg-path": "python3",
        "version": ">=3.10,<3.15"
      },
      "redis": {
        "pkg-path": "redis"
      },
      "zlib": {
        "pkg-path": "zlib"
      }
    },
    "vars": {
      "DEV_SERVER": "1",
      "FRAPPE_BENCH_ROOT": "$PWD",
      "FRAPPE_DB_HOST": "127.0.0.1",
      "FRAPPE_DB_PORT": "3306",
      "FRAPPE_DB_ROOT_PASSWORD": "frappe",
      "FRAPPE_DB_TYPE": "mariadb",
      "FRAPPE_ENV_TYPE": "development",
      "FRAPPE_REDIS_CACHE": "redis://127.0.0.1:13000",
      "FRAPPE_REDIS_QUEUE": "redis://127.0.0.1:11000",
      "FRAPPE_REDIS_SOCKETIO": "redis://127.0.0.1:12000",
      "FRAPPE_SOCKETIO_PORT": "9000",
      "FRAPPE_STREAM_LOGGING": "1",
      "FRAPPE_TUNE_GC": "1",
      "LIVE_RELOAD": "1",
      "MYSQLCLIENT_CFLAGS": "-I$FLOX_ENV/include/mysql",
      "MYSQLCLIENT_LDFLAGS": "-L$FLOX_ENV/lib -lmariadb",
      "SITES_PATH": "$FLOX_ENV_CACHE/sites"
    },
    "hook": {
      "on-activate": "  # Setup Python virtual environment\n  export PYTHON_DIR=\"$FLOX_ENV_CACHE/python\"\n  if [ ! -d \"$PYTHON_DIR\" ]; then\n    echo \"Creating python virtual environment in $PYTHON_DIR\"\n    python -m venv \"$PYTHON_DIR\"\n  fi\n\n  # Install frappe and dependencies in a subshell\n  (\n    source \"$PYTHON_DIR/bin/activate\"\n    # Install/upgrade pip and setuptools\n    pip install --quiet --upgrade pip setuptools wheel\n    \n    # Install frappe in editable mode if pyproject.toml exists\n    if [ -f \"pyproject.toml\" ]; then\n      pip install -e . --quiet\n    fi\n    \n    # Install bench CLI for convenience\n    pip install frappe-bench --quiet 2>/dev/null || true\n  )\n\n  # Create ephemeral sites directory structure in .flox/cache\n  mkdir -p \"$FLOX_ENV_CACHE/sites/assets\"\n  mkdir -p \"$FLOX_ENV_CACHE/logs\"\n  \n  # Create symlink to sites for convenience (if not exists)\n  if [ ! -e \"$PWD/sites\" ] || [ ! -L \"$PWD/sites\" ]; then\n    ln -sf \"$FLOX_ENV_CACHE/sites\" \"$PWD/sites\"\n  fi\n  \n  # Create symlink to logs for convenience (if not exists)\n  if [ ! -e \"$PWD/logs\" ] || [ ! -L \"$PWD/logs\" ]; then\n    ln -sf \"$FLOX_ENV_CACHE/logs\" \"$PWD/logs\"\n  fi\n  \n  # Create site-specific directories if sites exist\n  for site in \"$FLOX_ENV_CACHE/sites\"/*/ ; do\n    if [ -d \"$site\" ] && [ \"$(basename \"$site\")\" != \"assets\" ]; then\n      mkdir -p \"$site/error-snapshots\"\n      mkdir -p \"$site/indexes\"\n      mkdir -p \"$site/locks\"\n      mkdir -p \"$site/logs\"\n      mkdir -p \"$site/private/files\"\n      mkdir -p \"$site/public/files\"\n    fi\n  done\n\n  echo \"✅ Frappe environment ready!\"\n  echo \"   Sites: $FLOX_ENV_CACHE/sites/ (linked from $PWD/sites)\"\n  echo \"   Logs: $FLOX_ENV_CACHE/logs/ (linked from $PWD/logs)\"\n  echo \"\"\n  echo \"💡 Site data is ephemeral and won't be committed to git\"\n  echo \"💡 Use 'flox services start' to start all services\"\n"
    },
    "profile": {
      "bash": "  # Autogenerated by Flox\n\n  # Activate Python virtual environment\n  source \"$PYTHON_DIR/bin/activate\"\n  \n  # Helpful aliases\n  alias frappe-shell='python -c \"import frappe; frappe.init(site=\"<site-name>\"); frappe.connect()\"'\n  alias bench-restore='bench restore --db-root-password frappe'\n  alias bench-new-site='bench new-site --db-root-password frappe --admin-password admin'\n  \n  echo \"\"\n  echo \"╔════════════════════════════════════════════════════════════╗\"\n  echo \"║            Frappe Development Environment                  ║\"\n  echo \"╠════════════════════════════════════════════════════════════╣\"\n  echo \"║  Start all services:                                       ║\"\n  echo \"║    flox services start                                     ║\"\n  echo \"║                                                            ║\"\n  echo \"║  Create a new site:                                        ║\"\n  echo \"║    bench new-site mysite.local --admin-password admin      ║\"\n  echo \"║                                                            ║\"\n  echo \"║  Restore from backup:                                      ║\"\n  echo \"║    bench restore <backup.sql.gz>                           ║\"\n  echo \"║                                                            ║\"\n  echo \"║  Common commands:                                          ║\"\n  echo \"║    bench --site <site> migrate                             ║\"\n  echo \"║    bench --site <site> console                             ║\"\n  echo \"║    bench --site <site> clear-cache                         ║\"\n  echo \"╚════════════════════════════════════════════════════════════╝\"\n  echo \"\"\n",
      "zsh": "  # Autogenerated by Flox\n\n  # Activate Python virtual environment\n  source \"$PYTHON_DIR/bin/activate\"\n  \n  # Helpful aliases\n  alias frappe-shell='python -c \"import frappe; frappe.init(site=\"<site-name>\"); frappe.connect()\"'\n  alias bench-restore='bench restore --db-root-password frappe'\n  alias bench-new-site='bench new-site --db-root-password frappe --admin-password admin'\n  \n  echo \"\"\n  echo \"╔════════════════════════════════════════════════════════════╗\"\n  echo \"║            Frappe Development Environment                  ║\"\n  echo \"╠════════════════════════════════════════════════════════════╣\"\n  echo \"║  Start all services:                                       ║\"\n  echo \"║    flox services start                                     ║\"\n  echo \"║                                                            ║\"\n  echo \"║  Create a new site:                                        ║\"\n  echo \"║    bench new-site mysite.local --admin-password admin      ║\"\n  echo \"║                                                            ║\"\n  echo \"║  Restore from backup:                                      ║\"\n  echo \"║    bench restore <backup.sql.gz>                           ║\"\n  echo \"║                                                            ║\"\n  echo \"║  Common commands:                                          ║\"\n  echo \"║    bench --site <site> migrate                             ║\"\n  echo \"║    bench --site <site> console                             ║\"\n  echo \"║    bench --site <site> clear-cache                         ║\"\n  echo \"╚════════════════════════════════════════════════════════════╝\"\n  echo \"\"\n",
      "fish": "  # Autogenerated by Flox\n\n  # Activate Python virtual environment\n  source \"$PYTHON_DIR/bin/activate.fish\"\n  \n  # Helpful aliases\n  alias frappe-shell 'python -c \"import frappe; frappe.init(site=\"<site-name>\"); frappe.connect()\"'\n  alias bench-restore 'bench restore --db-root-password frappe'\n  alias bench-new-site 'bench new-site --db-root-password frappe --admin-password admin'\n",
      "tcsh": "  # Autogenerated by Flox\n\n  echo \"Activating python virtual environment\" >&2\n  source \"$PYTHON_DIR/bin/activate.csh\"\n\n  # End autogenerated by Flox\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-darwin",
        "x86_64-linux"
      ]
    },
    "services": {
      "caddy": {
        "command": "caddy run --config $PWD/config/Caddyfile",
        "is-daemon": true
      },
      "mariadb": {
        "command": "  mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake --disable-log-bin --innodb-buffer-pool-size=256M --innodb-log-file-size=64M --max-connections=200 --innodb-read-only-compressed=OFF --datadir=$FLOX_ENV_CACHE/mariadb --socket=$FLOX_ENV_CACHE/mariadb/mysql.sock\n",
        "is-daemon": true
      },
      "redis-cache": {
        "command": "  redis-server --port 13000 --bind 127.0.0.1 --dir $FLOX_ENV_CACHE/sites --dbfilename cache.rdb --save \"\" --appendonly no --maxmemory 500mb --maxmemory-policy allkeys-lru\n",
        "is-daemon": true
      },
      "redis-queue": {
        "command": "  redis-server --port 11000 --bind 127.0.0.1 --dir $FLOX_ENV_CACHE/sites --dbfilename queue.rdb --save 900 1 --save 300 10 --save 60 10000 --appendonly yes\n",
        "is-daemon": true
      },
      "redis-socketio": {
        "command": "  redis-server --port 12000 --bind 127.0.0.1 --dir $FLOX_ENV_CACHE/sites --dbfilename socketio.rdb --save \"\" --appendonly no\n",
        "is-daemon": true
      },
      "scheduler": {
        "command": "bench schedule",
        "is-daemon": true
      },
      "socketio": {
        "command": "  rm -f $FLOX_ENV_CACHE/sites/socketio.sock && node $PWD/apps/frappe/socketio.js\n",
        "is-daemon": true
      },
      "web": {
        "command": "  cd $FLOX_ENV_CACHE/sites && gunicorn -b 127.0.0.1:8000 -w 4 --max-requests 5000 --max-requests-jitter 500 -t 120 --graceful-timeout 30 --preload frappe.app:application\n",
        "is-daemon": true
      },
      "worker-long": {
        "command": "bench worker --queue long,default,short",
        "is-daemon": true
      },
      "worker-short": {
        "command": "bench worker --queue short,default",
        "is-daemon": true
      }
    },
    "build": {
      "myproject": {
        "command": "# Install dependencies\nyarn install\n\n# Build\nyarn build\n# -> assuming this yields a `dist` directory\n\n# Install the build result to `out` # (1)!\nmkdir -p $out\nmv ./dist $out/\n\n## If your app does not use a bundler\n## and needs additional node_modules at runtime,\n## `yarn prune` and copy the node modules to $out\n#\n# yarn prune --include \"prod\"\n# cp -r ./node_modules $out\n\n# Create a run script # (2)!\nmkdir -p $out/bin\necho \"#!/usr/bin/env sh\"\necho 'exec node $out/dist/index.js \"$@\"' >> $out/bin/myproject\nchmod 755 $out/bin/myproject\n"
      }
    }
  },
