## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# Redis services - using command-line flags instead of config files
redis-cache.command = """
  redis-server \
    --port 13000 \
    --bind 127.0.0.1 \
    --dir $FLOX_ENV_CACHE/sites \
    --dbfilename cache.rdb \
    --save "" \
    --appendonly no \
    --maxmemory 500mb \
    --maxmemory-policy allkeys-lru
"""
redis-cache.is-daemon = true

redis-queue.command = """
  redis-server \
    --port 11000 \
    --bind 127.0.0.1 \
    --dir $FLOX_ENV_CACHE/sites \
    --dbfilename queue.rdb \
    --save 900 1 \
    --save 300 10 \
    --save 60 10000 \
    --appendonly yes
"""
redis-queue.is-daemon = true

redis-socketio.command = """
  redis-server \
    --port 12000 \
    --bind 127.0.0.1 \
    --dir $FLOX_ENV_CACHE/sites \
    --dbfilename socketio.rdb \
    --save "" \
    --appendonly no
"""
redis-socketio.is-daemon = true

# MariaDB service with inline configuration
mariadb.command = """
  mysqld \
    --character-set-server=utf8mb4 \
    --collation-server=utf8mb4_unicode_ci \
    --skip-character-set-client-handshake \
    --disable-log-bin \
    --innodb-buffer-pool-size=256M \
    --innodb-log-file-size=64M \
    --max-connections=200 \
    --innodb-read-only-compressed=OFF \
    --datadir=$FLOX_ENV_CACHE/mariadb \
    --socket=$FLOX_ENV_CACHE/mariadb/mysql.sock
"""
mariadb.is-daemon = true

# Frappe web server (gunicorn)
# Note: Adjust worker count (-w) based on your system
web.command = """
  cd $FLOX_ENV_CACHE/sites && \
  gunicorn -b 127.0.0.1:8000 \
    -w 4 \
    --max-requests 5000 \
    --max-requests-jitter 500 \
    -t 120 \
    --graceful-timeout 30 \
    --preload \
    frappe.app:application
"""
web.is-daemon = true

# Frappe scheduler
scheduler.command = "bench schedule"
scheduler.is-daemon = true

# Background workers
worker-short.command = "bench worker --queue short,default"
worker-short.is-daemon = true

worker-long.command = "bench worker --queue long,default,short"
worker-long.is-daemon = true

# Node.js socketio server
socketio.command = """
  rm -f $FLOX_ENV_CACHE/sites/socketio.sock && \
  node $PWD/apps/frappe/socketio.js
"""
socketio.is-daemon = true

# Caddy frontend (if config/Caddyfile exists)
caddy.command = "caddy run --config $PWD/config/Caddyfile"
caddy.is-daemon = true


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
# environments = [
#     { dir = "../common" }
# ]


## Build and publish your own packages ------------------------------
##  $ flox build
##  $ flox publish
## ------------------------------------------------------------------
[build]
[build.myproject]
command = '''
# Install dependencies
yarn install

# Build
yarn build
# -> assuming this yields a `dist` directory

# Install the build result to `out` # (1)!
mkdir -p $out
mv ./dist $out/

## If your app does not use a bundler
## and needs additional node_modules at runtime,
## `yarn prune` and copy the node modules to $out
#
# yarn prune --include "prod"
# cp -r ./node_modules $out

# Create a run script # (2)!
mkdir -p $out/bin
echo "#!/usr/bin/env sh"
echo 'exec node $out/dist/index.js "$@"' >> $out/bin/myproject
chmod 755 $out/bin/myproject
'''


## Other Environment Options -----------------------------------------
[options]
# Systems that environment is compatible with
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-darwin", "x86_64-linux"]
# Uncomment to disable CUDA detection.
# cuda-detection = false
