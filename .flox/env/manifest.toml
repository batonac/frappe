## Flox Environment Manifest for Frappe Development
version = 1


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
# Python and package management
python3.pkg-path = "python3"
python3.version = ">=3.10,<3.15"

# Web servers
caddy.pkg-path = "caddy"
nginx.pkg-path = "nginx"

# Database and cache
mariadb.pkg-path = "mariadb"
# libmysqlclient.pkg-path = "libmysqlclient"
redis.pkg-path = "redis"

# Node.js for socketio
nodejs.pkg-path = "nodejs_20"

# Build dependencies for Python packages
gcc.pkg-path = "gcc"
pkg-config.pkg-path = "pkg-config"
openssl.pkg-path = "openssl"
zlib.pkg-path = "zlib"
libffi.pkg-path = "libffi"

# Additional dependencies for Frappe (from devcontainer)
cups.pkg-path = "cups"                   # for libcups2-dev equivalent
poppler_utils.pkg-path = "poppler_utils" # for PDF processing

# Useful utilities
git.pkg-path = "git"
curl.pkg-path = "curl"
gnused.pkg-path = "gnused"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# Frappe environment variables
FRAPPE_ENV_TYPE = "development"
DEV_SERVER = "1"
FRAPPE_STREAM_LOGGING = "1"
FRAPPE_TUNE_GC = "1"
LIVE_RELOAD = "1"

# Database configuration
FRAPPE_DB_HOST = "127.0.0.1"
FRAPPE_DB_PORT = "3306"
FRAPPE_DB_TYPE = "mariadb"
FRAPPE_DB_ROOT_PASSWORD = "frappe"

# Redis configuration (using standard dev container ports)
FRAPPE_REDIS_CACHE = "redis://127.0.0.1:13000"
FRAPPE_REDIS_QUEUE = "redis://127.0.0.1:11000"
FRAPPE_REDIS_SOCKETIO = "redis://127.0.0.1:12000"

# Frappe paths - using .flox/cache for ephemeral data
FRAPPE_BENCH_ROOT = "$PWD"
SITES_PATH = "$FLOX_ENV_CACHE/sites"
FRAPPE_SOCKETIO_PORT = "9000"

# MySQL client build flags for mysqlclient Python package
MYSQLCLIENT_CFLAGS = "-I$FLOX_ENV/include/mysql"
MYSQLCLIENT_LDFLAGS = "-L$FLOX_ENV/lib -lmariadb"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = """
  # Setup Python virtual environment
  export PYTHON_DIR="$FLOX_ENV_CACHE/python"
  if [ ! -d "$PYTHON_DIR" ]; then
    echo "Creating python virtual environment in $PYTHON_DIR"
    python -m venv "$PYTHON_DIR"
  fi

  # Install frappe and dependencies in a subshell
  (
    source "$PYTHON_DIR/bin/activate"
    # Install/upgrade pip and setuptools
    pip install --quiet --upgrade pip setuptools wheel
    
    # Install frappe in editable mode if pyproject.toml exists
    if [ -f "pyproject.toml" ]; then
      pip install -e . --quiet
    fi
    
    # Install bench CLI for convenience
    pip install frappe-bench --quiet 2>/dev/null || true
  )

  # Create ephemeral sites directory structure in .flox/cache
  mkdir -p "$FLOX_ENV_CACHE/sites/assets"
  mkdir -p "$FLOX_ENV_CACHE/logs"
  
  # Create symlink to sites for convenience (if not exists)
  if [ ! -e "$PWD/sites" ] || [ ! -L "$PWD/sites" ]; then
    ln -sf "$FLOX_ENV_CACHE/sites" "$PWD/sites"
  fi
  
  # Create symlink to logs for convenience (if not exists)
  if [ ! -e "$PWD/logs" ] || [ ! -L "$PWD/logs" ]; then
    ln -sf "$FLOX_ENV_CACHE/logs" "$PWD/logs"
  fi
  
  # Create site-specific directories if sites exist
  for site in "$FLOX_ENV_CACHE/sites"/*/ ; do
    if [ -d "$site" ] && [ "$(basename "$site")" != "assets" ]; then
      mkdir -p "$site/error-snapshots"
      mkdir -p "$site/indexes"
      mkdir -p "$site/locks"
      mkdir -p "$site/logs"
      mkdir -p "$site/private/files"
      mkdir -p "$site/public/files"
    fi
  done

  echo "✅ Frappe environment ready!"
  echo "   Sites: $FLOX_ENV_CACHE/sites/ (linked from $PWD/sites)"
  echo "   Logs: $FLOX_ENV_CACHE/logs/ (linked from $PWD/logs)"
  echo ""
  echo "💡 Site data is ephemeral and won't be committed to git"
  echo "💡 Use 'flox services start' to start all services"
"""


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
bash = """
  # Autogenerated by Flox

  # Activate Python virtual environment
  source "$PYTHON_DIR/bin/activate"
  
  # Helpful aliases
  alias frappe-shell='python -c "import frappe; frappe.init(site=\"<site-name>\"); frappe.connect()"'
  alias bench-restore='bench restore --db-root-password frappe'
  alias bench-new-site='bench new-site --db-root-password frappe --admin-password admin'
  
  echo ""
  echo "╔════════════════════════════════════════════════════════════╗"
  echo "║            Frappe Development Environment                  ║"
  echo "╠════════════════════════════════════════════════════════════╣"
  echo "║  Start all services:                                       ║"
  echo "║    flox services start                                     ║"
  echo "║                                                            ║"
  echo "║  Create a new site:                                        ║"
  echo "║    bench new-site mysite.local --admin-password admin      ║"
  echo "║                                                            ║"
  echo "║  Restore from backup:                                      ║"
  echo "║    bench restore <backup.sql.gz>                           ║"
  echo "║                                                            ║"
  echo "║  Common commands:                                          ║"
  echo "║    bench --site <site> migrate                             ║"
  echo "║    bench --site <site> console                             ║"
  echo "║    bench --site <site> clear-cache                         ║"
  echo "╚════════════════════════════════════════════════════════════╝"
  echo ""
"""
