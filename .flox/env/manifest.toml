# Frappe web server (gunicorn)
web.command = """
  cd $FLOX_ENV_CACHE/sites && \
  gunicorn -b 127.0.0.1:8000 \
    -w 4 \
    --max-requests 5000 \
    --max-requests-jitter 500 \
    -t 120 \
    --graceful-timeout 30 \
    --preload \
    frappe.app:application
"""
web.is-daemon = true
web.shutdown.command = "pkill -f 'gunicorn.*frappe.app:application'"

# Frappe scheduler
scheduler.command = "bench schedule"
scheduler.is-daemon = true
scheduler.shutdown.command = "pkill -f 'bench schedule'"

# Background workers
worker-short.command = "bench worker --queue short,default"
worker-short.is-daemon = true
worker-short.shutdown.command = "pkill -f 'bench worker.*short,default'"

worker-long.command = "bench worker --queue long,default,short"
worker-long.is-daemon = true
worker-long.shutdown.command = "pkill -f 'bench worker.*long,default,short'"

# Node.js socketio server
socketio.command = """
  rm -f $FLOX_ENV_CACHE/sites/socketio.sock && \
  node $FLOX_ENV_PROJECT/socketio.js
"""
socketio.is-daemon = true
socketio.shutdown.command = "pkill -f 'node.*socketio.js'"

# Caddy frontend (if config/Caddyfile exists)
caddy.command = "caddy run --config $FLOX_ENV_PROJECT/.flox/env/Caddyfile"
caddy.is-daemon = true
caddy.shutdown.command = "caddy stop"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
# environments = [
#     { dir = "../common" }
# ]


## Build and publish your own packages ------------------------------
##  $ flox build
##  $ flox publish
## ------------------------------------------------------------------
[build]
[build.myproject]
command = '''
# Install dependencies
yarn install

# Build
yarn build
# -> assuming this yields a `dist` directory

# Install the build result to `out` # (1)!
mkdir -p $out
mv ./dist $out/

## If your app does not use a bundler
## and needs additional node_modules at runtime,
## `yarn prune` and copy the node modules to $out
#
# yarn prune --include "prod"
# cp -r ./node_modules $out

# Create a run script # (2)!
mkdir -p $out/bin
echo "#!/usr/bin/env sh"
echo 'exec node $out/dist/index.js "$@"' >> $out/bin/myproject
chmod 755 $out/bin/myproject
'''


## Other Environment Options -----------------------------------------
[options]
# Systems that environment is compatible with
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-darwin", "x86_64-linux"]
# Uncomment to disable CUDA detection.
# cuda-detection = false
