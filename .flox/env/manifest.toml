## Flox Environment Manifest for Frappe Development
version = 1


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
# Python and package management
python3.pkg-path = "python314"
# python3.version = "3.14.0"
# python3.systems = ["x86_64-linux", "aarch64-darwin"]

uv.pkg-path = "uv"           # Modern Python package installer

# Web servers
caddy.pkg-path = "caddy"
nginx.pkg-path = "nginx"

# Database and cache
sqlite.pkg-path = "sqlite"
libmysqlclient.pkg-path = "mariadb-connector-c"
redis.pkg-path = "redis"

# Pre-built mysqlclient from nixpkgs
mysqlclient.pkg-path = "python314Packages.mysqlclient"
pip.pkg-path = "python314Packages.pip"
gunicorn.pkg-path = "python314Packages.gunicorn"

# Node.js for socketio
nodejs.pkg-path = "nodejs_24"

# Build dependencies for Python packages
gcc.pkg-path = "gcc"
pkg-config.pkg-path = "pkg-config"
openssl.pkg-path = "openssl"
zlib.pkg-path = "zlib"
libffi.pkg-path = "libffi"

# Additional dependencies for Frappe (from devcontainer)
cups.pkg-path = "cups"                   # for libcups2-dev equivalent
poppler-utils.pkg-path = "poppler-utils" # for PDF processing

# Useful utilities
git.pkg-path = "git"
curl.pkg-path = "curl"
gnused.pkg-path = "gnused"
just.pkg-path = "just"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# Frappe environment variables
FRAPPE_ENV_TYPE = "development"
DEV_SERVER = "1"
FRAPPE_STREAM_LOGGING = "1"
FRAPPE_TUNE_GC = "1"
LIVE_RELOAD = "1"

# Database configuration (kept for reference)
# FRAPPE_DB_HOST = "127.0.0.1"
# FRAPPE_DB_PORT = "3306"
# FRAPPE_DB_TYPE = "mariadb"
# FRAPPE_DB_ROOT_PASSWORD = "frappe"

# Database configuration - using SQLite for local dev
FRAPPE_DB_TYPE = "sqlite"
FRAPPE_DB_NAME = "frappe"

# Redis configuration (using standard dev container ports)
FRAPPE_REDIS_CACHE = "redis://127.0.0.1:13080"
FRAPPE_REDIS_QUEUE = "redis://127.0.0.1:11080"
FRAPPE_REDIS_SOCKETIO = "redis://127.0.0.1:12080"

# Frappe paths - FLOX_ENV_CACHE is the bench root
FRAPPE_BENCH_ROOT = "$FLOX_ENV_CACHE"
SITES_PATH = "$FLOX_ENV_CACHE/sites"
FRAPPE_SOCKETIO_PORT = "9080"

# Enable uv for faster Python package installation
BENCH_USE_UV = "1"

# MySQL client build configuration for mysqlclient Python package
MSHEADER = "$FLOX_ENV/include/mysql/mysql.h"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = """
  # Create bench directory structure in FLOX_ENV_CACHE (the bench root)
  mkdir -p "$FLOX_ENV_CACHE"/{apps,sites/assets,config,logs,config/pids}
  
  # Symlink frappe source ($PWD) into FLOX_ENV_CACHE/apps/frappe
  mkdir -p "$FLOX_ENV_CACHE/apps"
  if [ ! -e "$FLOX_ENV_CACHE/apps/frappe" ]; then
    ln -sf "$PWD" "$FLOX_ENV_CACHE/apps/frappe"
  fi

  # Provision apps.txt in the sites directory
  # This allows bench to recognize the frappe app
  if [ ! -e "$FLOX_ENV_CACHE/sites/apps.txt" ]; then
    echo "frappe" > "$FLOX_ENV_CACHE/sites/apps.txt"
  fi
  
  # Setup Python virtual environment
  export PYTHON_DIR="$FLOX_ENV_CACHE/env"
  if [ ! -d "$PYTHON_DIR" ]; then
    echo "Creating python virtual environment in $PYTHON_DIR"
    python -m venv "$PYTHON_DIR"
  fi
  
  # Create convenience symlinks in $PWD for bench directories
  # These allow running bench commands from the frappe development root
  for dir in apps env sites config logs; do
    if [ ! -e "$PWD/$dir" ] || [ ! -L "$PWD/$dir" ]; then
      ln -sf "$FLOX_ENV_CACHE/$dir" "$PWD/$dir"
    fi
  done

  # Install frappe and dependencies in a subshell
  (
    source "$PYTHON_DIR/bin/activate"
    # Install/upgrade pip, setuptools, wheel using uv
    uv pip install --quiet --upgrade pip setuptools wheel --python "$PYTHON_DIR/bin/python"
    
    # Install frappe in editable mode from $PWD using uv
    uv pip install -e "$PWD" --quiet --python "$PYTHON_DIR/bin/python"
    
    # Install bench CLI using uv
    uv pip install frappe-bench --quiet --python "$PYTHON_DIR/bin/python" 2>/dev/null || true
  )
  
  # Create site-specific directories if sites exist
  for site in "$FLOX_ENV_CACHE/sites"/*/ ; do
    if [ -d "$site" ] && [ "$(basename "$site")" != "assets" ]; then
      mkdir -p "$site/db"
      mkdir -p "$site/error-snapshots"
      mkdir -p "$site/indexes"
      mkdir -p "$site/locks"
      mkdir -p "$site/logs"
      mkdir -p "$site/private/files"
      mkdir -p "$site/public/files"
    fi
  done

  echo "✅ Frappe bench environment ready!"
  echo "   Bench root: $FLOX_ENV_CACHE"
  echo "   Frappe source: $PWD"
  echo "   Working directory: $PWD (bench commands work here!)"
  echo "   Using uv for Python package management"
  echo ""
  echo "💡 Site data is ephemeral and won't be committed to git"
  echo "💡 Run 'flox services start' to start all services"
"""


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
bash = """
  # Activate Python virtual environment
  source "$PYTHON_DIR/bin/activate"
  
  # Helpful aliases
  alias frappe-shell='python -c "import frappe; frappe.init(site=\"<site-name>\"); frappe.connect()"'
  alias bench-new-site='bench new-site --db-type sqlite --admin-password admin'
  
  echo ""
  echo "╔════════════════════════════════════════════════════════════╗"
  echo "║            Frappe Development Environment                  ║"
  echo "║                  (SQLite Edition)                          ║"
  echo "╠════════════════════════════════════════════════════════════╣"
  echo "║  Start all services:                                       ║"
  echo "║    flox services start                                     ║"
  echo "║                                                            ║"
  echo "║  Create a new site:                                        ║"
  echo "║    bench new-site frappe-dev.localhost --db-type sqlite    ║"
  echo "║                                                            ║"
  echo "║  Common commands (run from $PWD):                          ║"
  echo "║    bench --site <site> migrate                             ║"
  echo "║    bench --site <site> console                             ║"
  echo "║    bench --site <site> clear-cache                         ║"
  echo "╚════════════════════════════════════════════════════════════╝"
  echo ""
  echo "Note: Using SQLite for local development."
  echo "      For production, use MariaDB or PostgreSQL."
  echo ""
"""
