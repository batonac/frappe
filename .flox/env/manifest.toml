## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# Redis services - using command-line flags instead of config files
redis-cache.command = """
  mkdir -p $FLOX_ENV_CACHE/sites && \
  redis-server \
    --port 13080 \
    --bind 127.0.0.1 \
    --dir $FLOX_ENV_CACHE/sites \
    --dbfilename cache.rdb \
    --save "" \
    --appendonly no \
    --maxmemory 500mb \
    --maxmemory-policy allkeys-lru
"""
redis-cache.is-daemon = true
redis-cache.shutdown.command = "redis-cli -p 13080 shutdown"

redis-queue.command = """
  mkdir -p $FLOX_ENV_CACHE/sites && \
  redis-server \
    --port 11080 \
    --bind 127.0.0.1 \
    --dir $FLOX_ENV_CACHE/sites \
    --dbfilename queue.rdb \
    --save 900 1 \
    --save 300 10 \
    --save 60 10000 \
    --appendonly no
"""
redis-queue.is-daemon = true
redis-queue.shutdown.command = "redis-cli -p 11080 shutdown"

redis-socketio.command = """
  mkdir -p $FLOX_ENV_CACHE/sites && \
  redis-server \
    --port 12080 \
    --bind 127.0.0.1 \
    --dir $FLOX_ENV_CACHE/sites \
    --dbfilename socketio.rdb \
    --save "" \
    --appendonly no
"""
redis-socketio.is-daemon = true
redis-socketio.shutdown.command = "redis-cli -p 12080 shutdown"


